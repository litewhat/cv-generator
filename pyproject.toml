[project]
name = "cv-generator"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Paweł Zielonka", email = "lite.what@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "jinja2>=3.1.6",
    "markdown>=3.10.3",
    "pyyaml>=6.0.3",
    "weasyprint>=69.0",
]

[project.scripts]
cv-generator = "cv_generator.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv.build-backend]
module-name = ["cv_generator", "lib"]
